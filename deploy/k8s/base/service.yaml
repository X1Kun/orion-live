apiVersion: v1
kind: Service
metadata:
  name: orion-api
  namespace: orion-live
  labels:
    app.kubernetes.io/name: orion-live
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orion-live
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
