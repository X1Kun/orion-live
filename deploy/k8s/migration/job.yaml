apiVersion: batch/v1
kind: Job
metadata:
  name: orion-migrate
  namespace: orion-live
  labels:
    app.kubernetes.io/name: orion-live
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-live
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/x1kun/orion-live:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/orion-migrate
          envFrom:
            - configMapRef:
                name: orion-runtime-config
            - secretRef:
                name: orion-runtime-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
